version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: rosgvard-backend:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - NODE_ENV=production
    ports:
      - 4000:4000
    depends_on: []

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rosgvard-frontend:latest
    restart: unless-stopped
    expose:
      - 80

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/var/www/certbot
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - ./letsencrypt:/var/www/certbot
    entrypoint: ''

# Note: This compose expects an external PostgreSQL (DATABASE_URL configured).
# If you want Postgres in Docker, add a postgres service and set DATABASE_URL accordingly.
