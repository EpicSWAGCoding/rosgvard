version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: rosgvard-backend:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - NODE_ENV=production
    ports:
      - 4000:4000
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rosgvard-frontend:latest
    restart: unless-stopped
    expose:
      - 80

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/var/www/certbot
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - ./letsencrypt:/var/www/certbot
    entrypoint: ''

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=rosgvard
      - POSTGRES_PASSWORD=change_me
      - POSTGRES_DB=rosgvard_db
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:

# Note: This compose now includes a Postgres service. For production, set
# `DATABASE_URL` in `.env` to: postgresql://<user>:<pass>@postgres:5432/rosgvard_db
